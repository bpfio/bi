name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # 启用 bin 级伪端点 e2e 与 pty 真人面回归(BI-26.2/BI-26.4;本地开发缺省跳过)
      BI_PTY_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 安装 python 依赖(最小集:openpyxl;BI-21 链4 xlsx 勾稽;本机肥环境掩盖 CI 缺件)
        run: python -m pip install openpyxl
      - name: 安装依赖(冻结锁文件;BI-30.2b:auto-install 无法解析 workspace 嵌套依赖)
        run: bun install --frozen-lockfile
      - name: 全仓测试(含伪端点 e2e 与 pty 回归)
        run: bun test
      - name: core 类型
        run: cd packages/core && bunx tsc --noEmit
      - name: tui 类型
        run: cd packages/tui && bunx tsc --noEmit
      - name: 版本双源同步(BI-26.6)
        run: bun test scripts/version-sync.test.ts
